{% extends "base.html" %}

{% block title %}Sign In - AI Resume Analyzer{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon bg-primary text-white d-inline-flex p-3 rounded-circle mb-2">
                        <i class="bi bi-box-arrow-in-right fs-4"></i>
                    </div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Sign in to access your resumes and recommendations</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember" name="remember" checked>
                            <label class="form-check-label small" for="remember">Remember me</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <!-- Demo Account Helper for Viva Presentation -->
                <div class="p-3 bg-light rounded-3 border text-center mb-3">
                    <small class="fw-bold d-block text-muted mb-2"><i class="bi bi-info-circle me-1"></i> Academic Demo Accounts:</small>
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillDemo('student@demo.com', 'password123')">
                            <i class="bi bi-person me-1"></i> Demo Student
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-dark" onclick="fillDemo('admin@demo.com', 'admin123')">
                            <i class="bi bi-shield-lock me-1"></i> Demo Admin
                        </button>
                    </div>
                </div>

                <div class="text-center">
                    <small class="text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-semibold text-primary">Sign up</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
